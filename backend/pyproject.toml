[project]
name = "soshuhen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # 1.0 removed selectolax.parser (the Modest backend) that six sources import,
    # and an unbounded range let a fresh image install it: every process that
    # loads the source registry died on import. Lift this with a move to lexbor.
    "selectolax>=0.3,<1.0",
    "apscheduler>=3.10",
    "sse-starlette>=2.1",
    "pillow>=11.0",
    # Reads the bookmarks and page text of a novel PDF a user imports. BSD-3.
    "pypdf>=5.1",
    # FastAPI's form parser, for the import screen's file upload. Apache-2.0.
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mcp>=2.2",
]
# The MCP server is spawned by a model's client, not by Compose, so the SDK is
# an extra rather than a runtime dependency of the api and worker images.
mcp = [
    "mcp>=2.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Decimal("12") states the intent of a decimal literal; the numeric form does not.
# Tests also reach for module internals on purpose.
"tests/*" = ["FURB157", "PLR0402", "SLF001"]
